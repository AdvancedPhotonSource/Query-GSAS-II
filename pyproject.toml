[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsas2-query"
version = "0.3.1"
description = "Query-GSAS-II Documentation Assistant — semantic search and AI answers over GSAS-II tutorials and help pages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pawan K. Tripathi", email = "ptripathi@anl.gov" },
    { name = "Mathew J. Cherukara", email = "mcherukara@anl.gov" },
    { name = "Brian H. Toby", email = "toby@anl.gov" },
]
keywords = ["gsas", "crystallography", "rag", "documentation", "xrd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "chromadb>=0.5.0",
    "tokenizers>=0.15.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0"]
llama_cpp = ["llama-cpp-python>=0.2.0"]
gui       = ["wxPython>=4.2.0"]
dev       = ["pytest>=8.0"]

[project.scripts]
gsas2-query     = "gsas_query.cli:main"
gsas2-query-web = "gsas_query._web:main"

[project.urls]
Repository = "https://github.com/AdvancedPhotonSource/Query-GSAS-II"

[tool.hatch.build.targets.wheel]
packages = ["gsas_query"]
